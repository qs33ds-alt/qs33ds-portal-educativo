<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QS33DS · Còpies locals de prova</title><link rel="stylesheet" href="./ui.css"></head><body><div class="qs-suitebar"><strong>Aula QS33DS · V6</strong><a href="./index.html">Inici</a><a href="./agenda-proves.html">Agenda</a><a href="./generador-pi-proves.html">PI</a><a href="./dades.html">Còpies locals</a><a href="./ia-local.html">Pont IA local</a><small>Només dades fictícies</small></div><div class="qs-data-page"><header><h1>Còpies de les dades de prova</h1><nav><a href="./index.html">Dashboard</a> · <a href="./agenda-proves.html">Agenda</a> · <a href="./generador-pi-proves.html">PI</a></nav></header><main><p class="qs-warning">Només les dades fictícies de la versió de proves. No emmagatzemar informació personal d'alumnat.</p><section><h2>Còpia local</h2><button id="export">Exportar JSON</button><label>Importar JSON <input type="file" id="import" accept=".json,application/json"></label><button id="apply">Confirmar importació</button><button id="clear">Esborrar dades de prova</button></section><section><h2>Estat de les dades</h2><output id="status" aria-live="polite">Preparat</output><ul id="keys"></ul></section></main></div><script>const KEYS=['qs33ds_dashboard_v2_recovered_v1','qs33ds_agenda_docent_fase3_demo_v1','qs33ds_pi_fase3_proves_v1'];const output=document.getElementById('status');const list=document.getElementById('keys');function show(){list.replaceChildren();KEYS.forEach(k=>{const li=document.createElement('li');li.textContent=k+' : '+(localStorage.getItem(k)?'Desat':'Sense dades');list.append(li)})}show();function backup(){const data={schema:'qs33ds.portal.demo.backup.v1',created:new Date().toISOString(),items:{}};for(const key of KEYS){const value=localStorage.getItem(key);if(value!==null)data.items[key]=JSON.parse(value)}const file=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download='qs33ds_proves_copia.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);output.textContent='Còpia exportada';}document.getElementById('export').addEventListener('click',()=>{try{backup()}catch{output.textContent='Error en la còpia'}});function valid(k,v){if(k===KEYS[0])return v&&v.schema==='qs33ds-dashboard-v2-recovered'&&Array.isArray(v.notes)&&v.notes.length<=200&&v.notes.every(n=>n&&typeof n.title==='string'&&n.title.length<=100&&typeof n.body==='string'&&n.body.length<=4000)&&v.slots&&!Array.isArray(v.slots)&&typeof v.slots==='object'&&Object.keys(v.slots).length<=100&&Object.values(v.slots).every(x=>typeof x==='string'&&x.length<=180);if(k===KEYS[1])return Array.isArray(v)&&v.length<=2000&&v.every(x=>x&&typeof x.id==='string'&&typeof x.title==='string'&&x.title.length<=120&&typeof x.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&typeof x.time==='string'&&typeof x.category==='string'&&typeof x.notes==='string'&&x.notes.length<=700);if(k===KEYS[2])return v&&v.schema==='qs33ds.pi.prototype.v1'&&['code','year','student','group','strengths','barriers','objectives','measures','monitoring'].every(k=>typeof v[k]==='string'&&v[k].length<=2500);return false}document.getElementById('clear').onclick=()=>{if(!confirm('Esborrar només les tres dades de prova?'))return;KEYS.forEach(k=>localStorage.removeItem(k));show();output.textContent='Dades de prova esborrades'};document.getElementById('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>1000000)throw Error('Fitxer massa gran');const d=JSON.parse(await file.text());if(d.schema!=='qs33ds.portal.demo.backup.v1'||!d.items)throw Error('Format desconegut');window.qsPendingImport=d.items;output.textContent='Fitxer llegit: confirma la importació';}catch(err){output.textContent=err.message}};document.getElementById('apply').onclick=()=>{const d=window.qsPendingImport;if(!d)return;const ks=Object.keys(d);if(!ks.length||ks.some(k=>!KEYS.includes(k)||!valid(k,d[k])))return alert('Còpia incompatible');if(!confirm('Importar les dades?'))return;for(const k of ks)localStorage.setItem(k,JSON.stringify(d[k]));show()};</script></body></html>
