<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>QS33DS · Tauler lliure V1</title><style>
:root{font:15px system-ui,-apple-system,Segoe UI,sans-serif;color:#263e37;background:#f6f7f4}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e1e8e3;padding:20px 26px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}h1{font:normal 34px Georgia,serif;margin:4px 0}.eyebrow{font-size:11px;letter-spacing:.16em;color:#608c7e;font-weight:bold}p{margin:0;color:#73827b;font-size:13px}.actions,.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,.filebtn{font:600 13px system-ui;min-height:37px;padding:9px 13px;background:#fff;border:1px solid #d3ded6;color:#315c4d;border-radius:9px;cursor:pointer}button:hover,.filebtn:hover{background:#edf5ef}button.primary{background:#296252;color:white;border-color:#296252}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #397b70;outline-offset:2px}.filebtn input{display:none}.bar{padding:10px 26px;background:#fbfdfa;border-bottom:1px solid #e1e8e3}.swatch{min-height:0;padding:0;width:24px;height:24px;border-radius:50%;border:2px solid #ffffff}.swatch.active{outline:2px solid #3f7262}.tip{font-size:12px;color:#74857c;margin-left:auto}.viewport{overflow:auto;height:calc(100vh - 170px);min-height:450px;background:#f4f6f2;position:relative}.world{position:relative;width:1660px;height:1080px;background:radial-gradient(#d4ded6 1px,transparent 1px) 0 0/24px 24px}.note{position:absolute;border:1px solid #0000000c;border-radius:14px;box-shadow:0 10px 26px #213b311f;display:flex;flex-direction:column;min-width:175px;min-height:145px;overflow:hidden}.note.selected{outline:2px solid #4a8573;outline-offset:2px}.head{height:39px;flex-shrink:0;display:flex;gap:5px;align-items:center;padding:5px 8px;touch-action:none;cursor:grab}.grip{color:#607269;font-size:18px;padding-left:4px}.title{width:30px;flex:1;border:0;outline:0;background:transparent;color:#293d34;font:bold 13px system-ui}.head button{border:0;padding:2px 5px;min-height:25px;background:transparent;font-size:17px;color:#526459}.note textarea{flex:1;min-height:0;width:100%;resize:none;border:0;background:transparent;outline:none;padding:8px 15px;color:#36493e;line-height:1.5;font:14px system-ui}.foot{height:20px;font:10px system-ui;color:#64776b;padding:0 13px}.resize{position:absolute;right:0;bottom:0;width:23px;height:23px;border-radius:7px 0 12px 0;background:#0000000b;color:#61776b;text-align:center;line-height:23px;cursor:nwse-resize;touch-action:none}.toast{position:fixed;bottom:15px;left:20px;padding:9px 13px;background:#285c4e;color:#fff;border-radius:8px;font-size:12px;opacity:0;transition:opacity .2s}.toast.show{opacity:1}@media(max-width:750px){header{padding:13px}h1{font-size:27px}.bar{padding:10px}.viewport{height:calc(100vh - 225px)}.tip{margin-left:0;width:100%}}
</style></head><body><header><div><div class="eyebrow">QS33DS · PORTAL EDUCATIU / PROVES</div><h1>El meu tauler</h1><p>Notes visuals per organitzar el teu dia.</p></div><div class="actions"><button class="primary" id="add">＋ Nova nota</button><button id="undo">↶ Desfer</button><button id="download">↓ Exportar</button><label class="filebtn">↑ Importar<input type="file" id="upload" accept=".json,application/json"></label></div></header><div class="bar"><span style="font-size:12px;color:#61776c;font-weight:bold">Colors:</span><span class="actions" id="swatches"></span><button id="less">−</button><span id="zoomtext" style="font-size:12px">100%</span><button id="more">＋</button><button id="normal">100%</button><span class="tip">Arrossega per la capçalera · Redimensiona per la cantonada · Desat automàtic local</span></div><main class="viewport" id="viewport"><div id="stage" style="position:relative;width:1660px;height:1080px"><section class="world" id="world"></section></div></main><div class="toast" id="toast" role="status"></div><script>
(function(){'use strict';const KEY='qs33ds_tauler_v1_isolat',colors=['#fff3c3','#e2f0e7','#e4edf9','#f6e4e1','#efe7fa','#f8ebdb'];let notes=[],color=colors[0],zoom=1,z=0,selected='',history=[],timer;const world=document.getElementById('world'),stage=document.getElementById('stage'),viewport=document.getElementById('viewport'),$=id=>document.getElementById(id),clamp=(x,min,max)=>Math.max(min,Math.min(max,x)),id=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}function save(){try{localStorage.setItem(KEY,JSON.stringify({version:1,notes}))}catch(e){toast('No es pot desar: exporta una còpia')}}function soon(){clearTimeout(timer);timer=setTimeout(save,200)}function snap(){history.push(JSON.stringify(notes));if(history.length>30)history.shift();$('undo').disabled=false}function norm(n){return{id:String(n.id||id()).slice(0,80),x:clamp(Number(n.x)||0,0,1450),y:clamp(Number(n.y)||0,0,900),w:clamp(Number(n.w)||270,175,650),h:clamp(Number(n.h)||210,145,550),title:String(n.title||'').slice(0,100),text:String(n.text||'').slice(0,6000),color:colors.includes(n.color)?n.color:colors[0],z:clamp(Number(n.z)||1,1,9999),locked:!!n.locked}}function select(nid){selected=nid;world.querySelectorAll('.note').forEach(el=>el.classList.toggle('selected',el.dataset.id===nid))}function render(){world.replaceChildren();notes.sort((a,b)=>a.z-b.z);notes.forEach(n=>{const el=document.createElement('article');el.className='note';el.dataset.id=n.id;Object.assign(el.style,{left:n.x+'px',top:n.y+'px',width:n.w+'px',height:n.h+'px',background:n.color,zIndex:n.z});const head=document.createElement('div');head.className='head';const grip=document.createElement('span');grip.className='grip';grip.textContent='⠿';const name=document.createElement('input');name.className='title';name.value=n.title;name.maxLength=100;name.setAttribute('aria-label','Títol de la nota');name.addEventListener('change',()=>{snap();n.title=name.value;soon()});name.addEventListener('focus',()=>select(n.id));const lock=document.createElement('button');lock.textContent=n.locked?'●':'○';lock.title=n.locked?'Desbloquejar':'Bloquejar';lock.onclick=()=>{snap();n.locked=!n.locked;render();save()};const dup=document.createElement('button');dup.title='Duplicar';dup.textContent='⧉';dup.onclick=()=>{snap();const cp={...n,id:id(),x:clamp(n.x+28,0,1450),y:clamp(n.y+28,0,900),z:++z,locked:false};notes.push(cp);render();select(cp.id);save()};const del=document.createElement('button');del.title='Eliminar';del.textContent='×';del.onclick=()=>{if(!confirm('Eliminar aquesta nota?'))return;snap();notes=notes.filter(x=>x.id!==n.id);render();save()};head.append(grip,name,lock,dup,del);const body=document.createElement('textarea');body.value=n.text;body.placeholder='Escriu aquí...';body.maxLength=6000;body.setAttribute('aria-label','Contingut');let capturing=false;body.onfocus=()=>{capturing=false;select(n.id)};body.oninput=()=>{if(!capturing){snap();capturing=true}n.text=body.value;soon()};body.onblur=()=>{capturing=false;save()};const foot=document.createElement('div');foot.className='foot';foot.textContent=n.locked?'Nota bloquejada':'Mou i canvia la mida';const res=document.createElement('div');res.className='resize';res.textContent='◢';head.onpointerdown=e=>{if(n.locked||e.button!==0||e.target===name||e.target.closest('button'))return;start(e,head,n,el,'move')};res.onpointerdown=e=>{if(n.locked||e.button!==0)return;start(e,res,n,el,'resize')};el.onpointerdown=()=>select(n.id);el.append(head,body,foot,res);world.append(el)});select(selected)}function start(e,target,n,el,type){e.preventDefault();snap();select(n.id);n.z=++z;el.style.zIndex=n.z;target.setPointerCapture(e.pointerId);const sx=e.clientX,sy=e.clientY,x=n.x,y=n.y,w=n.w,h=n.h;function move(ev){const dx=(ev.clientX-sx)/zoom,dy=(ev.clientY-sy)/zoom;if(type==='move'){n.x=clamp(Math.round(x+dx),0,1660-n.w);n.y=clamp(Math.round(y+dy),0,1080-n.h);el.style.left=n.x+'px';el.style.top=n.y+'px'}else{n.w=clamp(Math.round(w+dx),175,Math.min(650,1660-n.x));n.h=clamp(Math.round(h+dy),145,Math.min(550,1080-n.y));el.style.width=n.w+'px';el.style.height=n.h+'px'}soon()}function end(){target.removeEventListener('pointermove',move);target.removeEventListener('pointerup',end);target.removeEventListener('pointercancel',end);save()}target.addEventListener('pointermove',move);target.addEventListener('pointerup',end);target.addEventListener('pointercancel',end)}function add(){snap();const n={id:id(),x:clamp(Math.round((viewport.scrollLeft+130)/zoom),0,1330),y:clamp(Math.round((viewport.scrollTop+90)/zoom),0,800),w:275,h:210,title:'Nota nova',text:'',color,z:++z,locked:false};notes.push(n);render();select(n.id);save();const input=world.querySelector('[data-id="'+n.id+'"] .title');input.focus();input.select()}function setzoom(v){zoom=clamp(Math.round(v*10)/10,.5,1.5);world.style.transform='scale('+zoom+')';world.style.transformOrigin='top left';stage.style.width=(1660*zoom)+'px';stage.style.height=(1080*zoom)+'px';$('zoomtext').textContent=Math.round(zoom*100)+'%'}$('add').onclick=add;$('undo').onclick=()=>{if(!history.length)return;notes=JSON.parse(history.pop());z=Math.max(0,...notes.map(n=>n.z));render();save();$('undo').disabled=history.length===0};$('less').onclick=()=>setzoom(zoom-.1);$('more').onclick=()=>setzoom(zoom+.1);$('normal').onclick=()=>setzoom(1);colors.forEach(c=>{const b=document.createElement('button');b.className='swatch'+(color===c?' active':'');b.style.background=c;b.title='Color';b.onclick=()=>{color=c;document.querySelectorAll('.swatch').forEach(e=>e.classList.remove('active'));b.classList.add('active');const n=notes.find(x=>x.id===selected);if(n){snap();n.color=c;render();save()}};$('swatches').append(b)});$('download').onclick=()=>{const blob=new Blob([JSON.stringify({schema:'qs33ds.tauler.v1',notes},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='QS33DS_Tauler_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};$('upload').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>2000000){toast('Arxiu massa gran');return}try{const d=JSON.parse(await f.text());if(d.schema!=='qs33ds.tauler.v1'||!Array.isArray(d.notes)||d.notes.length>300)throw Error();if(!confirm('Substituir les notes actuals? Exporta una còpia abans.'))return;snap();notes=d.notes.map(norm);z=Math.max(0,...notes.map(n=>n.z));render();save();toast('Importació correcta')}catch(e){toast('Format no vàlid')}};world.ondblclick=e=>{if(e.target===world)add()};try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.notes))notes=d.notes.map(norm)}catch(e){}if(!notes.length){notes=[{id:id(),x:110,y:100,w:290,h:220,title:'Idees de la setmana',text:'Arrossega la nota per la capçalera.\nFes servir la cantonada per ampliar-la.',color:colors[0],z:1,locked:false},{id:id(),x:445,y:130,w:285,h:220,title:'Tasques pendents',text:'• Preparar materials\n• Revisar activitats\n• Organitzar la setmana',color:colors[1],z:2,locked:false},{id:id(),x:775,y:94,w:300,h:210,title:'Recordatori',text:'Pots canviar el color i duplicar les notes.',color:colors[2],z:3,locked:false}];save()}z=Math.max(0,...notes.map(n=>n.z));render();setzoom(1);$('undo').disabled=true})();
</script></body></html>
