<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>QS33DS · Tauler lliure V1</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#253b39;background:#f5f5f0}
*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #408c83;outline-offset:2px}
header{padding:21px 28px 16px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;background:#fcfcf9;border-bottom:1px solid #e5e9e4}
.eyebrow{font-size:11px;letter-spacing:.17em;color:#78928b;font-weight:800;text-transform:uppercase}h1{font-size:clamp(24px,3vw,34px);font-family:Georgia,serif;letter-spacing:-.02em;font-weight:500;margin:4px 0}p{margin:0;color:#72817c;font-size:13px}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn{border:1px solid #d9e2dd;background:#fff;color:#345a51;padding:10px 14px;border-radius:11px;font-weight:650;font-size:13px;min-height:39px}
.btn:hover{background:#eff5f1}.btn.primary{background:#285f53;color:#fff;border-color:#285f53}.btn.primary:hover{background:#1f4f44}.btn:disabled{opacity:.42}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 26px;background:#fbfcfa;border-bottom:1px solid #e5e9e4}
.swatches{display:flex;gap:6px}.swatch{border:2px solid transparent;width:24px;height:24px;border-radius:50%;cursor:pointer}.swatch.active{outline:2px solid #527d75;outline-offset:2px}
.sep{width:1px;height:26px;background:#dae1dc;margin:0 2px}.hint{font-size:12px;color:#74827d;margin-left:auto}
.viewport{height:calc(100vh - 178px);min-height:430px;overflow:auto;background:#f4f5f1;position:relative}
.board{position:relative;transform-origin:top left;width:1680px;height:1080px;background-image:radial-gradient(#cfd7d0 1px,transparent 1px);background-size:23px 23px}
.note{position:absolute;border-radius:14px;box-shadow:0 13px 32px #30443b17,0 2px 7px #30443b14;border:1px solid #0000000c;display:flex;flex-direction:column;min-width:175px;min-height:145px;overflow:hidden}
.note.selected{outline:2px solid #4d8177;outline-offset:2px}.note.dragging{box-shadow:0 24px 46px #29423832}
.note-head{display:flex;align-items:center;gap:6px;height:38px;padding:4px 8px 2px 13px;touch-action:none;cursor:grab;flex-shrink:0}.note-head:active{cursor:grabbing}
.grip{font-size:15px;color:#536258a3;letter-spacing:-3px;user-select:none}.note-title{flex:1;border:0;background:transparent;color:#2b3b35;font-weight:800;font-size:13px;width:50px;min-width:0;padding:5px 4px;outline:none}
.note button{border:0;background:transparent;border-radius:6px;color:#52645b;padding:4px 6px;font-size:14px;line-height:1}.note button:hover{background:#00000010}
.note textarea{resize:none;flex:1;border:0;background:transparent;padding:6px 15px 14px;color:#33453e;outline:none;font-size:14px;line-height:1.55;width:100%;min-height:0}
.note-footer{height:24px;display:flex;justify-content:space-between;align-items:center;padding:0 12px 6px;font-size:10px;color:#56675f9e;pointer-events:none}
.handle{position:absolute;width:22px;height:22px;bottom:0;right:0;cursor:nwse-resize;touch-action:none;border-radius:8px 0 12px 0;display:grid;place-items:center;color:#53625891;background:#00000008;pointer-events:auto;font-size:16px}
.empty{position:absolute;top:150px;left:130px;background:#ffffffc9;border:1px dashed #bfcbc2;padding:26px;border-radius:14px;color:#718278}
.status{position:fixed;bottom:14px;left:20px;background:#2b5549;color:white;padding:8px 13px;border-radius:9px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}.status.show{opacity:1}
.filelabel{display:inline-flex;align-items:center}.filelabel input{display:none}
@media(max-width:760px){header{padding:14px}.toolbar{padding:12px}.viewport{height:calc(100vh - 225px)}.hint{width:100%;margin-left:0}.btn{padding:9px 10px}h1{font-size:26px}}
</style></head>
<body>
<header><div><div class="eyebrow">QS33DS · Portal Educatiu / Proves</div><h1>El meu tauler</h1><p>Un espai propi per a idees, recordatoris i notes visuals.</p></div>
<div class="controls"><button class="btn primary" id="add">＋ Nova nota</button><button class="btn" id="undo" title="Desfer l'última acció">↶ Desfer</button><button class="btn" id="export">↓ Exportar</button><label class="btn filelabel">↑ Importar<input id="import" type="file" accept=".json,application/json"></label></div></header>
<div class="toolbar"><span style="font-size:12px;font-weight:700;color:#6c7b74">Color nou:</span>
<div class="swatches" id="swatches"></div><span class="sep"></span>
<button class="btn" id="zoomout" title="Allunyar">−</button><span id="zoomlabel" style="min-width:43px;text-align:center;color:#53685f;font-size:12px">100%</span><button class="btn" id="zoomin" title="Apropar">＋</button><button class="btn" id="resetzoom">100%</button>
<span class="hint">Arrossega per la capçalera · Canvia la mida des de la cantonada · Desat automàtic al navegador</span></div>
<main class="viewport" id="viewport" aria-label="Tauler de notes"><section class="board" id="board" aria-label="Zona de treball"></section></main>
<div class="status" id="status" role="status"></div>
<script>
(function(){
"use strict";
const KEY="qs33ds_tauler_v1_isolat", COLORS=["#fff3c3","#e2f0e7","#e4edf9","#f6e4e1","#efe7fa","#f8ebdb"];
const S={notes:[],color:COLORS[0],zoom:1,z:0}, board=document.getElementById("board"),viewport=document.getElementById("viewport");
let selected=null,history=[],saveTimer=0,moveState=null,noticeTimer=0;
function $(id){return document.getElementById(id)}
function uid(){return (self.crypto&&crypto.randomUUID)?crypto.randomUUID():"n"+Date.now().toString(36)+Math.random().toString(36).slice(2)}
function safe(s,n){return String(s||"").slice(0,n)}
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
function flash(msg){const el=$("status");el.textContent=msg;el.classList.add("show");clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.classList.remove("show"),1800)}
function capture(){history.push(JSON.stringify(S.notes));if(history.length>35)history.shift();$("undo").disabled=false}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({version:1,notes:S.notes}));}catch(e){flash("No s'ha pogut desar. Exporta una còpia.")}}
function soon(){clearTimeout(saveTimer);saveTimer=setTimeout(persist,220)}
function valid(v){return v&&typeof v==="object"&&Array.isArray(v.notes)&&v.notes.length<=300}
function normalize(n){return {id:safe(n.id,80)||uid(),x:clamp(Number(n.x)||0,0,1600),y:clamp(Number(n.y)||0,0,1000),w:clamp(Number(n.w)||260,175,700),h:clamp(Number(n.h)||210,145,600),title:safe(n.title,90),text:safe(n.text,6000),color:COLORS.includes(n.color)?n.color:COLORS[0],z:clamp(Number(n.z)||1,1,10000),locked:!!n.locked}}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const data=JSON.parse(raw);if(valid(data))S.notes=data.notes.map(normalize)}}catch(e){flash("No s'han pogut llegir les notes guardades")};S.z=Math.max(0,...S.notes.map(n=>n.z))}
function sample(){S.notes=[{id:uid(),x:95,y:100,w:290,h:225,title:"Idees de la setmana",text:"Doble clic al text per editar.\nArrossega aquesta nota per la capçalera.",color:COLORS[0],z:1,locked:false},{id:uid(),x:425,y:145,w:280,h:220,title:"Tasques",text:"• Preparar materials\n• Revisar activitats\n• Organitzar la setmana",color:COLORS[1],z:2,locked:false},{id:uid(),x:765,y:90,w:310,h:235,title:"Recordatori",text:"Pots ampliar aquesta nota des de la cantonada inferior dreta.",color:COLORS[2],z:3,locked:false}];S.z=3;persist()}
function select(id){selected=id;document.querySelectorAll(".note").forEach(el=>el.classList.toggle("selected",el.dataset.id===id))}
function add(){capture();const rect=viewport.getBoundingClientRect();const x=clamp(Math.round((viewport.scrollLeft+Math.max(80,rect.width*.24))/S.zoom),0,1300),y=clamp(Math.round((viewport.scrollTop+Math.max(70,rect.height*.15))/S.zoom),0,780);const n={id:uid(),x,y,w:280,h:205,title:"Nota nova",text:"",color:S.color,z:++S.z,locked:false};S.notes.push(n);render();select(n.id);soon();const e=board.querySelector('[data-id="'+n.id+'"] .note-title');if(e){e.focus();e.select()}}
function render(){board.innerHTML="";S.notes.sort((a,b)=>a.z-b.z).forEach(n=>{
const card=document.createElement("article");card.className="note";card.dataset.id=n.id;card.style.cssText="left:"+n.x+"px;top:"+n.y+"px;width:"+n.w+"px;height:"+n.h+"px;background:"+n.color+";z-index:"+n.z;
const head=document.createElement("div");head.className="note-head";head.title="Arrossega per moure";
const grip=document.createElement("span");grip.className="grip";grip.textContent="⠿";
const title=document.createElement("input");title.className="note-title";title.value=n.title;title.maxLength=90;title.setAttribute("aria-label","Títol de la nota");
title.addEventListener("focus",()=>select(n.id));title.addEventListener("change",()=>{capture();n.title=title.value;soon()});
const lock=document.createElement("button");lock.title=n.locked?"Desbloquejar":"Bloquejar";lock.textContent=n.locked?"🔒":"♧";lock.setAttribute("aria-label",lock.title);
lock.onclick=()=>{capture();n.locked=!n.locked;render();select(n.id);soon()};
const dup=document.createElement("button");dup.title="Duplicar";dup.textContent="⧉";dup.onclick=()=>{capture();const c={...n,id:uid(),x:clamp(n.x+30,0,1400),y:clamp(n.y+30,0,850),z:++S.z,locked:false};S.notes.push(c);render();select(c.id);soon()};
const del=document.createElement("button");del.title="Eliminar";del.textContent="×";del.setAttribute("aria-label","Eliminar nota");del.onclick=()=>{if(!confirm("Vols eliminar aquesta nota?"))return;capture();S.notes=S.notes.filter(x=>x.id!==n.id);render();soon()};
head.append(grip,title,lock,dup,del);
const txt=document.createElement("textarea");txt.value=n.text;txt.placeholder="Escriu aquí...";txt.maxLength=6000;txt.setAttribute("aria-label","Contingut de la nota");
let editing=false;txt.addEventListener("focus",()=>{select(n.id);editing=false});txt.addEventListener("input",()=>{if(!editing){capture();editing=true}n.text=txt.value;soon()});txt.addEventListener("blur",()=>{editing=false;persist()});
const foot=document.createElement("div");foot.className="note-footer";foot.textContent=n.locked?"Posició bloquejada":"Arrossega · Redimensiona";
const resize=document.createElement("div");resize.className="handle";resize.textContent="◢";resize.title="Canvia la mida";
card.append(head,txt,foot,resize);board.append(card);
head.addEventListener("pointerdown",e=>{if(e.target.closest("button")||e.target===title||n.locked||e.button!==0)return;start(e,n,card,"move")});
resize.addEventListener("pointerdown",e=>{if(e.button!==0||n.locked)return;start(e,n,card,"resize")});
card.addEventListener("pointerdown",()=>select(n.id));
});select(selected)}
function start(e,n,card,kind){e.preventDefault();capture();select(n.id);n.z=++S.z;card.style.zIndex=n.z;const target=e.currentTarget;target.setPointerCapture(e.pointerId);const sx=e.clientX,sy=e.clientY,ox=n.x,oy=n.y,ow=n.w,oh=n.h;card.classList.add("dragging");moveState=n.id;
function move(ev){const dx=(ev.clientX-sx)/S.zoom,dy=(ev.clientY-sy)/S.zoom;if(kind==="move"){n.x=clamp(Math.round(ox+dx),0,1680-n.w);n.y=clamp(Math.round(oy+dy),0,1080-n.h);card.style.left=n.x+"px";card.style.top=n.y+"px"}else{n.w=clamp(Math.round(ow+dx),175,Math.min(700,1680-n.x));n.h=clamp(Math.round(oh+dy),145,Math.min(600,1080-n.y));card.style.width=n.w+"px";card.style.height=n.h+"px"}soon()}
function end(){target.removeEventListener("pointermove",move);target.removeEventListener("pointerup",end);target.removeEventListener("pointercancel",end);card.classList.remove("dragging");moveState=null;persist()}
target.addEventListener("pointermove",move);target.addEventListener("pointerup",end);target.addEventListener("pointercancel",end)}
function zoom(v){S.zoom=clamp(v,.5,1.5);board.style.transform="scale("+S.zoom+")";const rect=board.getBoundingClientRect();const spacer=viewport.querySelector(".spacer");if(spacer){spacer.style.width=1680*S.zoom+"px";spacer.style.height=1080*S.zoom+"px"}$("zoomlabel").textContent=Math.round(S.zoom*100)+"%"}
function download(){const blob=new Blob([JSON.stringify({schema:"qs33ds.tauler.v1",version:1,notes:S.notes},null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="QS33DS_Tauler_"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);flash("Còpia exportada")}
$("add").onclick=add;$("undo").onclick=()=>{if(!history.length)return;S.notes=JSON.parse(history.pop());S.z=Math.max(0,...S.notes.map(n=>n.z));render();persist();$("undo").disabled=!history.length};
$("export").onclick=download;
$("import").addEventListener("change",async e=>{const file=e.target.files[0];e.target.value="";if(!file)return;if(file.size>2000000){flash("Arxiu massa gran");return}try{const d=JSON.parse(await file.text());if(d.schema!=="qs33ds.tauler.v1"||!valid(d))throw Error("Format incorrecte");if(!confirm("Substituir el tauler actual per les notes importades? Exporta abans si vols conservar-les."))return;capture();S.notes=d.notes.map(normalize);S.z=Math.max(0,...S.notes.map(n=>n.z));render();persist();flash("Tauler importat")}catch(err){flash("No s'ha pogut importar l'arxiu")}});
COLORS.forEach(c=>{const b=document.createElement("button");b.className="swatch"+(c===S.color?" active":"");b.style.background=c;b.title="Color de la nota";b.setAttribute("aria-label","Color "+c);b.onclick=()=>{S.color=c;document.querySelectorAll(".swatch").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(selected){const n=S.notes.find(x=>x.id===selected);if(n){capture();n.color=c;render();soon()}}};$("swatches").append(b)});
$("zoomin").onclick=()=>zoom(Math.round((S.zoom+.1)*10)/10);$("zoomout").onclick=()=>zoom(Math.round((S.zoom-.1)*10)/10);$("resetzoom").onclick=()=>zoom(1);
load();if(!S.notes.length)sample();render();$("undo").disabled=true;
const spacer=document.createElement("div");spacer.className="spacer";spacer.style.cssText="width:1680px;height:1080px;pointer-events:none;position:absolute;left:0;top:0";viewport.append(spacer);
board.style.position="absolute";board.style.top="0";board.style.left="0";zoom(1);
board.addEventListener("dblclick",e=>{if(e.target===board)add()});
})();
</script></body></html>
