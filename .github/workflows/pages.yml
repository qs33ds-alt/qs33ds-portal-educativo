name: Publish Portal and Eines d'Aula
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/eines-aula/package-lock.json
      - run: npm ci
        working-directory: apps/eines-aula
      - run: npm test
        working-directory: apps/eines-aula
      - run: npm run build
        working-directory: apps/eines-aula
      - run: node --test files/tests/cloud.test.cjs
      - name: Prepare full portal with current React build
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='apps' --exclude='_site' ./ _site/
          rm -rf _site/eines-aula
          cp -r apps/eines-aula/dist _site/eines-aula
          rm _site/eines-aula/dashboard.html
          cp apps/eines-aula/dist/dashboard.html _site/index.html
          mkdir -p _site/assets
          cp -r apps/eines-aula/dist/assets/. _site/assets/
          test -f _site/assets/$(basename $(find apps/eines-aula/dist/assets -name 'dashboard-*.js' -print -quit))
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
